<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragonrush Apps</title>
  <link rel="stylesheet" href="gate.css">
  <style>
    .apps { display: grid; gap: 8px; margin: 4px 0 14px; }
    .apps a, .request { display: block; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--btn); color: var(--text); font-weight: 600; text-decoration: none; }
    .apps a:hover { background: var(--btn-hover); }
    .request { background: var(--accent); color: var(--card); border-color: transparent; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <h1>Dragonrush Apps</h1>
    <p>Private tools for the 69 clans. To use Tracker Beta, sign in with your Google or Discord account and request access.</p>
    <a class="request" href="request/">Request access to Tracker Beta</a>
    <p><a href="privacy.html">Privacy policy</a></p>
  </main>
</body>
</html>
